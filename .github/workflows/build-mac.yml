name: Build Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1/M2/M3/M4)
            label: apple-silicon
          - runner: macos-15-intel    # Intel Macs
            label: intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Test (engine + headless window)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -X faulthandler -m pytest -v -rf --tb=short tests 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # post the failure details as an annotation so they can be read on the run page
            msg=$( (grep -E "^(E |FAILED |>)" pytest.log | head -40; echo "---- last lines ----"; tail -45 pytest.log) | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests failed::${msg}"
          fi
          exit $status

      - name: Build app and DMG
        run: bash packaging/build_mac.sh

      - name: Smoke-test the built app starts
        run: |
          "dist/Tile Mapper.app/Contents/MacOS/Tile Mapper" &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID; else echo "App exited early"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tile-Mapper-${{ matrix.label }}
          path: dist/*.dmg
          retention-days: 30

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import tilemapper; print(tilemapper.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Publish release for this version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tile Mapper ${{ steps.ver.outputs.version }}
          body_path: packaging/RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: dist/*.dmg

      - name: Attach to versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/RELEASE_NOTES.md
          files: dist/*.dmg
